name: proyecto_comandero
description: "TPV y Comandero de hostelería integrado con FacturaScripts: modo Servidor/Host (tablet) y modo Comandero (móvil)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado (solo capa de presentación)
  flutter_riverpod: ^3.4.3

  # Persistencia e integración con el ERP
  mysql_client: ^0.0.27 # MySQL directo: escandallos y stock (transacciones ACID)
  http: ^1.6.0 # API REST v3 de FacturaScripts

  # Configuración y almacenamiento local
  shared_preferences: ^2.5.6 # ajustes no sensibles
  flutter_secure_storage: ^11.2.0 # token de la API, contraseña MySQL, código de emparejamiento
  path_provider: ^2.1.6 # diario local del host (mesas abiertas, cola de sincronización)

  # Utilidades
  collection: ^1.19.1
  equatable: ^3.0.0
  image: ^4.10.1 # decodificación del logo para rasterizado ESC/POS (Dart puro, apto para isolates)
  intl: any # fijado por flutter_localizations
  logging: ^1.3.0
  meta: ^1.19.0
  qr: ^4.0.0 # QR tributario VERI*FACTU (Dart puro, apto para isolates)
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1 # la tablet-servidor no debe suspenderse

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test: # prueba de flujo de punta a punta en Windows
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1 # permite `dart test` sobre las capas Dart puro
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
