include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Código asíncrono (sockets, isolates, transacciones): ningún Future olvidado.
    - unawaited_futures
    - avoid_void_async
    - throw_in_finally
    # Tipado estricto: los JSON de red y del ERP se convierten explícitamente.
    - always_declare_return_types
    - avoid_dynamic_calls
    - only_throw_errors
    - test_types_in_equals
    # Estilo.
    - prefer_final_locals
    - prefer_single_quotes
    - directives_ordering
    - unnecessary_statements
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
